<div class="d-flex flex-column">


  <div class="card-custom">
    <div class="d-flex justify-content-between mb-4">
      <div class="d-flex flex-column ">
        <div class="d-flex align-items-center">
          <i class="pi pi-code fs-6 text-primary me-2"></i>
          <span class="fs-5 fw-medium ">Service</span>
        </div>
        <span class="small text-muted mt-1">
          Accédez en un clin d'œil à tous les services existants.
        </span>
      </div>
      <div>
        <p-button (click)="create()" label="Nouveau" icon="pi pi-plus" [rounded]="true"></p-button>
      </div>
    </div>
    <div>
      @if (loading){
        <g-loader></g-loader>
      }
      @if (services$ | async; as apiResponse){
        <div class="d-flex flex-column">
          <g-service-list [data]="apiResponse.data"></g-service-list>
        </div>
        <div class="d-flex flex-column align-items-end mt-4">
          <g-pagination
            [totalItems]="apiResponse.pagination?.total || 0"
            [pageIndex]="apiResponse.pagination?.currentPage || 1"
            [pageSize]="apiResponse.pagination?.limit!"
            (page)="onPageChange($event)"
          ></g-pagination>
        </div>
      }
    </div>


  </div>

  <p-dialog [modal]="true" position="top" [(visible)]="createMode" contentStyleClass="h-100" [style]="{ width: '30%', height: '80%' }">
    <ng-template #header>
      <div class="d-flex align-items-center">
        <span class="pi pi-pen-to-square me-2"></span>
        <span class="fw-medium fs-5">Creation de service</span>
      </div>
    </ng-template>
    <div class="h-100">
      <g-service-add (success)="isSave($event)"></g-service-add>
    </div>

  </p-dialog>
</div>
