<div class="">
  <div class="d-flex align-items-center mb-3">
    <div>
      <p-button [rounded]="true" severity="secondary" routerLink="/user-space/client/appointments" [outlined]="true" icon="pi pi-arrow-left"></p-button>
    </div>
    <div class="sub-title ms-2">
      Création du rendez-vous
    </div>
  </div>
<!--  <div class="card-custom"></div>-->
  <div class="card-custom">
    <form [formGroup]="appointmentForm">
      <div class=" row ">
        <div class="col">

          <div class="">
            <div class=" text-secondary mb-3">
              Date et l'heure
            </div>
            <div class="d-flex flex-column">
              <p-datePicker class="d-flex flex-column" formControlName="date" [inline]="true" [showTime]="true" hourFormat="24"></p-datePicker>
            </div>
          </div>

        </div>

        <div class="col-4">
          <div class="">
            <div class="d-flex justify-content-between align-items-center">
              <div class="fw-medium text-secondary">
                Services choisis
              </div>
              <div class="d-flex">
                <div class="me-2">
                  <p-button icon="pi pi-plus-circle" label="Ajout de service" severity="success" (click)="addNewService()" [text]="true" [rounded]="true"></p-button>
                </div>

                <p-button icon="pi pi-trash" severity="danger" (click)="clearAll()" [text]="true" [rounded]="true"></p-button>
              </div>
            </div>

            <div class="mt-3 px-2 overflow-auto" style="max-height: calc(100vh - 30%); /*min-height: 40rem*/">
              <div class="d-flex flex-column">
                @for ( service of chosenServices; track service._id){
                  <div class="row justify-content-between align-items-center mb-3">
                    <div class="col-10">
                      <g-service-item [data]="service"></g-service-item>
                    </div>
                    <div class="col-1 ms-2">
                      <p-button icon="pi pi-times" severity="secondary" [outlined]="true" [text]="true" [rounded]="true"></p-button>
                    </div>
                  </div>
                }
              </div>
            </div>
          </div>
        </div>

        <div class="">
          <p-select  optionLabel="name" placeholder="Select a country" class="w-full md:w-56">
            <ng-template #selectedItem let-selectedOption>
              <div class="flex items-center gap-2" *ngIf="selectedOption">
                <img
                  src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png"
                  [class]="'flag flag-' + selectedOption.code.toLowerCase()"
                  style="width: 18px"
                />
                <div>{{ selectedOption.name }}</div>
              </div>
            </ng-template>
            <ng-template let-country #item>
              <div class="flex items-center gap-2">
                <img
                  src="https://primefaces.org/cdn/primeng/images/demo/flag/flag_placeholder.png"
                  [class]="'flag flag-' + country.code.toLowerCase()"
                  style="width: 18px"
                />
                <div>{{ country.name }}</div>
              </div>
            </ng-template>
            <ng-template #dropdownicon>
              <i class="pi pi-map"></i>
            </ng-template>
            <ng-template #header>
              <div class="font-medium p-3">Available Countries</div>
            </ng-template>
            <ng-template #footer>
              <div class="p-3">
                <p-button label="Add New" fluid severity="secondary" text size="small" icon="pi pi-plus" />
              </div>
            </ng-template>
          </p-select>
        </div>
      </div>

      <div class="mt-3 d-flex justify-content-end">
        <p-button label="valider" [rounded]="true" (onClick)="submit()"></p-button>
      </div>
    </form>
  </div>




  <p-dialog [(visible)]="adding" [modal]="true"  [style]="{ width: '80%' }">
    <ng-template #header>
      <div class="d-inline-flex align-items-center justify-content-center">
        <span class="fw-bold whitespace-nowrap">Ajout des services</span>
      </div>
    </ng-template>
    <div>
      <g-select-service [(chosen)]="chosenServices" ></g-select-service>
    </div>
    <ng-template #footer>
      <p-button label="Cancel" [text]="true" severity="secondary" (click)="adding = false" />
      <p-button label="Save" [outlined]="true" severity="secondary" (click)="adding = false" />
    </ng-template>
  </p-dialog>

</div>
