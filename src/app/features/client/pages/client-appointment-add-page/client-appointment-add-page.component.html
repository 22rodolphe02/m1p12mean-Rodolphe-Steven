<div class="">
  <div class="card-custom">
    <div class="d-flex align-items-center mb-3">
      <div>
        <p-button [rounded]="true" severity="secondary" routerLink="/user-space/client/appointments" [outlined]="true" icon="pi pi-arrow-left"></p-button>
      </div>
      <div class="sub-title ms-2">
        Création du rendez-vous
      </div>
    </div>
    <form [formGroup]="appointmentForm">
      <div class="row justify-content-between">

        <div class="col-6 ">
          <div class="mb-3">
            <div class="">
              <div class=" text-secondary mb-1">
                Déscription
              </div>
              <div class="d-flex flex-column">
                <textarea rows="4" cols="30" pTextarea formControlName="description"></textarea>
              </div>
            </div>
          </div>
          <div class="">
            <div class=" text-secondary mb-3">
              Date et l'heure
            </div>
            <div class="d-flex flex-column">
              <p-datePicker
                class="d-flex flex-column"
                formControlName="date"
                [inline]="true"
                [showTime]="true" hourFormat="24"
                [minDate]="today"
                [showWeek]="false"
              ></p-datePicker>
            </div>
          </div>

          <div class="mb-4 mt-3">
            <g-select-vehicle (select)="selectVehicle($event)"></g-select-vehicle>

          </div>

        </div>

        <div class="col-4">
          <div class="">
            <div class="d-flex justify-content-between align-items-center">
              <div class="fw-medium text-secondary">
                Services choisis
              </div>
              <div class="d-flex">
                <div class="me-2">
                  <p-button icon="pi pi-plus-circle" label="Ajout de service" severity="success" (click)="addNewService()" [text]="true" [rounded]="true"></p-button>
                </div>

                <p-button icon="pi pi-trash" severity="danger" (click)="clearAll()" [text]="true" [rounded]="true"></p-button>
              </div>
            </div>

            <div class="mt-3 px-2 overflow-y-auto overflow-x-hidden" style="max-height: 35rem; /*min-height: 40rem*/">
              <div class="d-flex flex-column">
                @for ( service of chosenServices; track service._id){
                  <div class="row justify-content-between align-items-center mb-3">
                    <div class="col-10">
                      <g-service-item [data]="service"></g-service-item>
                    </div>
                    <div class="col-1 ms-2">
                      <p-button icon="pi pi-times" severity="secondary" (onClick)="delete(service._id)" [outlined]="true" [text]="true" [rounded]="true"></p-button>
                    </div>
                  </div>
                }
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="mt-3 d-flex justify-content-end">
        <p-button label="valider" [loading]="submitted" [rounded]="true" (onClick)="submit()"></p-button>
      </div>
    </form>
  </div>




  <p-dialog [(visible)]="adding" [modal]="true"  [style]="{ width: '80%' }">
    <ng-template #header>
      <div class="d-inline-flex align-items-center justify-content-center">
        <span class="fw-bold whitespace-nowrap">Ajout des services</span>
      </div>
    </ng-template>
    <div>
      <g-select-service [(chosen)]="chosenServices" ></g-select-service>
    </div>
  </p-dialog>

</div>
