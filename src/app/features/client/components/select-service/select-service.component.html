<div class="d-flex flex-column">
  @if (loading) {
    <g-loader></g-loader>
  }
  @if (this.services$ | async; as apiResponse){
    <div class="row">
      @for (service of apiResponse.data; track service._id; let index = $index) {
        <div class="col-4 mb-3">
          <g-service-item [selectable]="true" [data]="service" [selected]=isSelected(service) (onClick)="select(service, $event)"></g-service-item>
        </div>
      }
    </div>

    <div class="d-flex flex-column align-items-end">
      <div class="col-2">
        <g-pagination
          [totalItems]="apiResponse.pagination?.total || 0"
          [pageIndex]="apiResponse.pagination?.currentPage || 1"
          [pageSize]="apiResponse.pagination?.limit!"
          (page)="onPageChange($event)"
        ></g-pagination>
      </div>

    </div>

  }


</div>
