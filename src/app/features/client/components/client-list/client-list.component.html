<table class="table table-custom mt-2 ">
  <thead class=" table-header">
  <tr>
    <th>
      <div class="d-flex align-items-center">
        <span>Id</span>
      </div>
    </th>
    <th>
      <div class="d-flex align-items-center">
        <span>Nom</span>
      </div>
    </th>
    <th>
      <div class="d-flex align-items-center">
        <span>Nombre de Véhicule</span>
      </div>
    </th>
    <th>
      <div class="d-flex align-items-center">
        <span>Nombre d'intervention</span>
      </div>
    </th>
    <th>
      <div class="d-flex align-items-center">
        <span>Date d'inscription</span>
      </div>
    </th>
  </tr>
  </thead>
  <tbody>
    @for (client of clients; track client._id) {
      <tr>
        <td>
          <span>{{client._id}}</span>
        </td>
        <td>
          <a class="link text-capitalize" routerLink="{{actionLink}}/{{client._id}}">
            {{client.nom}} {{client.prenom}}
          </a>
        </td>
        <td>
          {{client.numberOfVehicle}}
        </td>
        <td>
          {{client.numberOfIntervention}}
        </td>
        <td>
          <div class="d-flex ">
            <div class="d-flex align-items-center badge-secondary text-secondary">
              <span class="">{{client.registrationDate | date: 'longDate'}}</span>
            </div>

          </div>
        </td>
      </tr>
    }


  </tbody>
</table>
