<div class="d-flex flex-column">
  <span class="fs-5 fw-medium">Nouveau pièces</span>
  <form [formGroup]="pieceForm" class="mt-3">
    <div class="row align-items-end">
      <div class="col-3">
        <span class="mb-1 text-secondary">Nom:</span>
        <input pInputText id="on_label" class="w-100" formControlName="nom"  autocomplete="off" />
      </div>

      <div class="col-3">
        <span class="mb-1 text-secondary">Prix unitaire:</span>
        <p-inputgroup>
          <p-inputgroup-addon>MGA</p-inputgroup-addon>
          <p-inputNumber formControlName="prixunitaire" placeholder="Price" />
        </p-inputgroup>
      </div>

      <div class="col-3">
        <span class="mb-1 text-secondary">Quantité:</span>
        <div>
          <p-inputNumber formControlName="quantite" [showButtons]="true" buttonLayout="horizontal" [inputStyle]="{ width: '3rem' }">
            <ng-template #incrementbuttonicon>
              <span class="pi pi-plus"></span>
            </ng-template>
            <ng-template #decrementbuttonicon>
              <span class="pi pi-minus"></span>
            </ng-template>
          </p-inputNumber>
        </div>
      </div>

      <div class="col-2 d-flex">
        <p-button label="enregistrer" (onClick)="onSubmit()"></p-button>
        <div class="ms-2">
          <p-button label="annuler" severity="secondary" (onClick)="cancel()"></p-button>
        </div>
      </div>
    </div>
  </form>

</div>
