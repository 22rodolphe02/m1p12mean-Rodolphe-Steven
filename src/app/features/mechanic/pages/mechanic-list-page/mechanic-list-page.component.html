<div>
  <div></div>
  <div class="d-flex flex-column card-custom align-items-end">
    @if (loading){
      <g-loader></g-loader>
    }
    @if (mechanics$ | async; as apiResponse){
      <div class="col-12">
        <g-mechanic-list [data]="apiResponse.data"></g-mechanic-list>
      </div>
      <div class="mt-4">
        <g-pagination [totalItems]="10"></g-pagination>
      </div>
    }

  </div>
</div>
