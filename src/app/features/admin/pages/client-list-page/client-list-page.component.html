<div>
  <div class="d-flex justify-content-between mb-4">
    <div class="d-flex align-items-center">
      <div class="d-flex flex-column">
        <span class="sub-title fw-medium ">Clients</span>
      </div>
    </div>
  </div>

  <div class="row align-items-stretch">
    <div class="col">
      <div class="card-custom">
        <div class="d-flex ">
          <div class="col-12">
            @if (loading) {
              <div class="d-flex justify-content-center align-items-center">
                <g-loader ></g-loader>
              </div>
            }
            @if (clients$ | async; as apiResponse) {
              <!--        @if (apiResponse) {-->
              <div>
                <g-client-list [data]="apiResponse.data" actionLink="/user-space/admin/clients"></g-client-list>
              </div>

              <div class="mt-4 d-flex justify-content-end">
                <g-pagination
                  [totalItems]="apiResponse.pagination?.total || 0"
                  [pageIndex]="apiResponse.pagination?.currentPage || 1"
                  [pageSize]="apiResponse.pagination?.limit!"
                  (page)="onPageChange($event)"
                ></g-pagination>
              </div>
            }
          </div>
<!--          <div class="col-12">-->
<!--            <g-client-list actionLink="/user-space/admin/clients"></g-client-list>-->
<!--          </div>-->
<!--        </div>-->
<!--        <div class="d-flex justify-content-end mt-4">-->
<!--          <g-pagination [totalItems]="100"></g-pagination>-->
<!--        </div>-->
      </div>
    </div>
  </div>
  </div>
</div>
