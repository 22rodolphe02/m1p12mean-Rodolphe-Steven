<div class="d-flex justify-content-center">
  <div class="col-12">
    <div class="d-flex justify-content-between mb-3">
      <div class="d-flex align-items-center">
        <p-button severity="secondary" (onClick)="back()" icon="pi pi-arrow-left" [rounded]="true" [outlined]="true"></p-button>
        <span class="sub-title ms-2">Rendez-vous</span>
        <span class="fw-bold d-flex align-items-center">
          <i class="pi pi-hashtag ms-1"></i>{{appointmentId}}
        </span>
      </div>
    </div>
    <div class="card-custom">
      @if (loading) {
        <g-loader></g-loader>
      }
      @if (appointment$ | async; as apiResponse) {
        @if (apiResponse){
          <g-appointment-details [data]="apiResponse.data"></g-appointment-details>
        }
      }
    </div>

  </div>
</div>
