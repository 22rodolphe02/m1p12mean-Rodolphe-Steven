<div class="p-4 d-flex min-vh-100 bg-white">
  <div class="col me-2 row flex-column align-items-center justify-content-between">
    <div class="d-flex col-11 justify-content-between">
      <div class="fs-4">
        <i class="pi pi-spin pi-cog fs-5 me-2"></i>
        <span>Garage</span>
      </div>
      <span>
        <p-button label="Go back" icon="pi pi-arrow-left" styleClass="w-100 rounded-3" [text]="true" />
      </span>
    </div>
    <div class="col-9">
      <div class="title d-flex flex-column">
        <span class="fs-4 fw-medium">Get Started Now</span>
        <span class="small">Enter your credentials to access your account</span>
      </div>
      <form [formGroup]="inscriptionForm">
        <div class="row flex-grow-1 justify-content-center align-items-center">
          <div class="mt-5">
            <div class="row justify-content-between">
              <div class="d-flex flex-column col">
                <label class="mb-1">Nom</label>
                <input type="text" class="rounded-3 " formControlName="nom" pInputText placeholder="John" />
              </div>
              <div class="d-flex flex-column col">
                <label class="mb-1">Prénom</label>
                <input type="text" class="rounded-3 " formControlName="prenom" pInputText placeholder="Peter" />
              </div>
            </div>

            <div class="row justify-content-between mt-4">
              <div class="d-flex flex-column col">
                <label class="mb-1">Adresse émail</label>
                <input type="email" class="rounded-3 " formControlName="email" pInputText placeholder="sc.travis@hotmail.com" />
              </div>

              <div class="d-flex flex-column col">
                <label class="mb-1">Numéro de téléphone</label>
<!--                <p-input-mask></p-input-mask>-->
                <p-inputmask mask="(+261) 99 99 999 99" formControlName="numero" placeholder="(+261) 34 01 234 56" />
<!--                <input type="text" class="rounded-3 " formControlName="numero" pInputText placeholder="(+261) 34 01 234 56" />-->
              </div>
            </div>

            <div class="d-flex flex-column mt-4">
              <label class="mb-1">Mot de passe</label>
              <p-password formControlName="motdepasse" inputStyleClass="w-100 rounded-3" styleClass="d-flex" [feedback]="false" [toggleMask]="true" />
            </div>

            <div class="d-flex flex-column mt-4">
              <label class="mb-1">Choisissez votre rôle</label>
              <p-select formControlName="role" [options]="roles" placeholder="Choisis un rôle" class="w-full md:w-56" optionLabel="label" optionValue="value" />
            </div>
          </div>
        </div>
        <div class="d-flex flex-column mt-4">
          <p-button label="Inscrire" (onClick)="onSubmit()" styleClass="w-100 rounded-3" />
        </div>
      </form>
    </div>
    <div class="d-flex col-auto mt-4 align-items-center">
      <span>Déjà un compte ?</span>
      <span class="">
        <p-button label="Connectez-vous ici" routerLink="/sign-in" [link]="true" styleClass="rounded-3" />
      </span>
    </div>
  </div>
  <div class="col-7 auth-img">
    <span class="fs-4">Bienvenue dans votre espace garage.</span>
    <span class="small">Inscrivez-vous pour accéder à toutes les fonctionnalités.</span>
  </div>
</div>
